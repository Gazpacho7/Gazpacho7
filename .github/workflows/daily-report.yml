name: Analisi giornaliera del portafoglio

on:
  schedule:
    # Lun-ven alle 06:17 UTC (07:17/08:17 in Italia), prima dell'apertura dei mercati europei.
    - cron: "17 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Genera il report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m portfolio_agent daily >> "$GITHUB_STEP_SUMMARY"
      - name: Salva report e diario nel repository
        run: |
          git config user.name "portfolio-agent"
          git config user.email "portfolio-agent@users.noreply.github.com"
          git add reports memory
          git diff --cached --quiet || git commit -m "Report del $(date +%F)"
          git push
